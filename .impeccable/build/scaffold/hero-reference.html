<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: canon-board.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700&family=Sofia+Sans+Semi+Condensed:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-wordmark-mark region chrome" data-region="wordmark-mark"><!-- the V monogram at icon scale, a two-path SVG glyph in the ink colour --></div>
  <div class="r-wordmark-text region text" data-region="wordmark-text"><!-- VAULT WORLDWIDE set small in dark bold caps beside the monogram --><p style="font-size:var(--r-wordmark-text-font);font-family:var(--r-wordmark-text-family),sans-serif;font-weight:var(--r-wordmark-text-weight);line-height:1.05;margin:0">wordmark-text</p></div>
  <div class="r-find-field region control" data-region="find-field"><!-- rounded search input with a magnifier icon, grey placeholder Search tasks..., and a command-K chip at its right: rebuild the control's chrome from the crop (comp-spec.mjs --crop find-field); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-filter-chips region control" data-region="filter-chips"><!-- three rounded outlined dropdown chips with chevrons: All Projects, Assignee: Me, Priority: Any: rebuild the control's chrome from the crop (comp-spec.mjs --crop filter-chips); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-new-button region control" data-region="new-button"><!-- solid blue rounded button, plus icon, the word New, and a chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop new-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topbar-rule region chrome" data-region="topbar-rule"><!-- 1px hairline across the full width closing the top bar --></div>
  <div class="r-lane-pending region chrome" data-region="lane-pending"><!-- light grey rounded lane panel with a hairline border, the PENDING column ground --></div>
  <div class="r-lane-rnd region chrome" data-region="lane-rnd"><!-- light grey rounded lane panel with a hairline border, the R&D column ground --></div>
  <div class="r-lane-active region chrome" data-region="lane-active"><!-- light grey rounded lane panel with a hairline border, the ACTIVE column ground --></div>
  <div class="r-lane-done region chrome" data-region="lane-done"><!-- light grey rounded lane panel with a hairline border, the DONE column ground --></div>
  <div class="r-lane-dusted region chrome" data-region="lane-dusted"><!-- light grey rounded lane panel with a hairline border, the DUSTED column ground, clipped by the drawer --></div>
  <div class="r-head-pending region text" data-region="head-pending"><!-- column heading PENDING in dark medium weight with the count 2 at the right edge --><p style="font-size:var(--r-head-pending-font);line-height:1.05;margin:0">head-pending</p></div>
  <div class="r-head-rnd region text" data-region="head-rnd"><!-- column heading R&D in dark medium weight with the count 3 at the right edge --><p style="font-size:var(--r-head-rnd-font);line-height:1.05;margin:0">head-rnd</p></div>
  <div class="r-head-active region text" data-region="head-active"><!-- column heading ACTIVE in dark medium weight with the count 2 at the right edge --><p style="font-size:var(--r-head-active-font);line-height:1.05;margin:0">head-active</p></div>
  <div class="r-head-done region text" data-region="head-done"><!-- column heading DONE in dark medium weight with the count 4 at the right edge --><p style="font-size:var(--r-head-done-font);line-height:1.05;margin:0">head-done</p></div>
  <div class="r-head-dusted region text" data-region="head-dusted"><!-- column heading DUSTED in dark medium weight with the count 1 at the right edge --><p style="font-size:var(--r-head-dusted-font);line-height:1.05;margin:0">head-dusted</p></div>
  <div class="r-card-site-redesign-pending region control" data-region="card-site-redesign-pending"><!-- white rounded job card with a hairline: SITE REDESIGN in caps over the grey line homepage: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-site-redesign-pending); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-update-branding region control" data-region="card-update-branding"><!-- white rounded job card with a hairline: UPDATE BRANDING in caps over the grey line brand guidelines: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-update-branding); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-market-research region control" data-region="card-market-research"><!-- white rounded job card with a hairline: MARKET RESEARCH in caps over the grey line competitive analysis: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-market-research); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-tech-spike region control" data-region="card-tech-spike"><!-- white rounded job card with a hairline: TECH SPIKE in caps over the grey line next-gen stack: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-tech-spike); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-design-exploration region control" data-region="card-design-exploration"><!-- white rounded job card with a hairline: DESIGN EXPLORATION in caps over the grey line mood boards: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-design-exploration); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-site-redesign-active region control" data-region="card-site-redesign-active"><!-- the selected job card: white, a 2px blue border and pale blue fill, SITE REDESIGN in caps over the grey line homepage: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-site-redesign-active); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-aesthetic-pass region control" data-region="card-aesthetic-pass"><!-- white rounded job card with a hairline: AESTHETIC PASS in caps over the grey line visual polish: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-aesthetic-pass); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-create-repo region control" data-region="card-create-repo"><!-- white rounded job card with a hairline and a round tick glyph: CREATE REPO in caps over the grey line vault-worldwide: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-create-repo); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-project-setup region control" data-region="card-project-setup"><!-- white rounded job card with a hairline and a round tick glyph: PROJECT SETUP in caps over the grey line boilerplate & config: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-project-setup); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-design-system-init region control" data-region="card-design-system-init"><!-- white rounded job card with a hairline and a round tick glyph: DESIGN SYSTEM INIT in caps over the grey line tokens & components: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-design-system-init); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-content-audit region control" data-region="card-content-audit"><!-- white rounded job card with a hairline and a round tick glyph: CONTENT AUDIT in caps over the grey line page inventory: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-content-audit); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-card-old-landing-page region control" data-region="card-old-landing-page"><!-- white rounded job card with a hairline: OLD LANDING PAGE in caps over the grey line deprecated: rebuild the control's chrome from the crop (comp-spec.mjs --crop card-old-landing-page); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-drawer-panel region chrome" data-region="drawer-panel"><!-- the white full-height detail drawer panel and its inner padding, holding the entered job --></div>
  <div class="r-drawer-rule region chrome" data-region="drawer-rule"><!-- vertical hairline separating the board from the detail drawer --></div>
  <div class="r-drawer-status region text" data-region="drawer-status"><!-- a small blue filled dot beside the word ACTIVE in blue caps --><p style="font-size:var(--r-drawer-status-font);line-height:1.05;margin:0">drawer-status</p></div>
  <div class="r-drawer-close region control" data-region="drawer-close"><!-- a thin grey close cross at the drawer's top right: rebuild the control's chrome from the crop (comp-spec.mjs --crop drawer-close); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-drawer-title region text" data-region="drawer-title"><!-- the entered job title SITE REDESIGN, the largest type on the surface, dark semibold caps --><p style="font-size:var(--r-drawer-title-font);font-family:var(--r-drawer-title-family),sans-serif;font-weight:var(--r-drawer-title-weight);line-height:1.05;margin:0">drawer-title</p></div>
  <div class="r-drawer-parent region text" data-region="drawer-parent"><!-- a small outlined folder icon beside the parent name homepage in grey --><p style="font-size:var(--r-drawer-parent-font);line-height:1.05;margin:0">drawer-parent</p></div>
  <div class="r-drawer-parent-rule region chrome" data-region="drawer-parent-rule"><!-- hairline under the drawer header, above the description --></div>
  <div class="r-drawer-description-label region text" data-region="drawer-description-label"><!-- small grey letter-spaced caps label DESCRIPTION --><p style="font-size:var(--r-drawer-description-label-font);line-height:1.05;margin:0">drawer-description-label</p></div>
  <div class="r-drawer-description-body region text" data-region="drawer-description-body"><!-- two short dark paragraphs of body copy about redesigning the homepage for clarity and conversion --><p style="font-size:var(--r-drawer-description-body-font);line-height:1.05;margin:0">drawer-description-body</p></div>
  <div class="r-drawer-subtasks-label region text" data-region="drawer-subtasks-label"><!-- small grey letter-spaced caps label SUBTASKS --><p style="font-size:var(--r-drawer-subtasks-label-font);line-height:1.05;margin:0">drawer-subtasks-label</p></div>
  <div class="r-drawer-subtasks-list region control" data-region="drawer-subtasks-list"><!-- five checkbox rows, the first two checked with blue filled boxes and the last three unchecked with grey outlines, each followed by a subtask sentence in dark text: rebuild the control's chrome from the crop (comp-spec.mjs --crop drawer-subtasks-list); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
