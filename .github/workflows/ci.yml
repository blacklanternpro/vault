# CI on every push and pull request, every branch (audit 12).
# Three jobs in parallel: checks (lint, build, unit, agent), browser tests
# (Playwright e2e incl. the accessibility check, the two-writer case against a
# real vault-agent, and the narrow-viewport smoke), and the speed harness.
# Locally, `npm run ci` runs the same steps in order.
name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24' # matches Vercel
  FORCE_COLOR: '1'

jobs:
  checks:
    name: lint · build · unit · agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - run: npm --prefix agent ci
      - name: Lint
        run: npm run lint
      - name: Build (tsc -b + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck e2e and scripts
        run: npm run typecheck:e2e
      - name: Agent typecheck
        run: npm --prefix agent run typecheck
      - name: Agent tests
        run: npm --prefix agent test

  e2e:
    name: e2e · a11y · two writers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - run: npm --prefix agent ci
      - id: pw
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright e2e (incl. accessibility, two writers, below 1200px)
        run: npm run e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  perf:
    name: speed harness (1,000 items)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - run: npm ci
      - id: pw
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Soft budget: over 50ms keypress-to-paint is a warning; only a median over 200ms fails (shared runners are noisy).
      - name: Speed harness
        run: npm run perf
      - name: Results to the job summary
        if: always()
        run: |
          if [ -f e2e/perf/results.json ]; then
            node -e '
              const r = require("./e2e/perf/results.json");
              const rows = Object.entries(r.keypress).map(([n, s]) => `| ${n} | ${s.median} | ${s.p95} | ${s.max} | ${s.longTasks} | ${s.verdict} |`);
              const load = r.load ? `Load to interactive: median **${r.load.median}ms**, p95 ${r.load.p95}ms over ${r.load.runs} loads.` : "";
              console.log([`### Speed harness — ${r.board.items} items (budget ${r.budgetMs}ms keypress-to-paint, soft)`, "", load, "", "| keypress → paint | median ms | p95 ms | max ms | long tasks | verdict |", "|---|---:|---:|---:|---:|---|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            e2e/perf/results.json
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
