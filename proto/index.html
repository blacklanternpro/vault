<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAULT_ prototype</title>
    <script>
      try {
        var vaultTheme = localStorage.getItem('vault:theme')
        if (vaultTheme === 'night' || vaultTheme === 'light') document.documentElement.dataset.theme = vaultTheme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/proto/main.tsx"></script>
  </body>
</html>
